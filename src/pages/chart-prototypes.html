<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fcefe0" />
    <meta name="format-detection" content="telephone=no" />
    <title>专业排盘</title>
    <link rel="stylesheet" href="../css/chart-prototypes.css" />
  </head>
  <body>
    <main class="chart-page">
      <header class="chart-header">
        <a class="back-button pressable" href="./index.html" aria-label="返回首页">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="m20 7-9 9 9 9" />
          </svg>
        </a>

        <div class="header-copy">
          <h1>专业排盘</h1>
          <p><span></span>择一法，起一局<span></span></p>
        </div>

        <button
          class="history-button pressable"
          type="button"
          data-action="history"
          aria-label="查看排盘记录"
        >
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M7 8v7h7M8.5 21a10 10 0 1 0 .4-10L7 15" />
          </svg>
        </button>

        <img
          class="header-mountain"
          src="../../public/images/top-mountain-hd-alpha.png"
          alt=""
        />
        <img
          class="header-ridge"
          src="../../public/images/right-mountains-hd-alpha.png"
          alt=""
        />
        <svg class="header-bamboo" viewBox="0 0 110 180" aria-hidden="true">
          <path d="M26 178C35 128 43 76 52 10M50 68c-17-14-29-17-42-13M46 93c17-14 33-17 49-12M39 124c-13-11-24-13-35-9M57 42c15-11 28-13 39-8" />
          <path d="M20 53c13 0 24 5 31 15M50 82c16-2 30 2 42 12M6 114c12 0 22 4 31 12M56 32c14-1 26 2 36 10" />
        </svg>
        <svg class="header-birds" viewBox="0 0 100 38" aria-hidden="true">
          <path d="M3 23c7-8 14-8 21 0 7-8 14-8 21 0M52 10c5-5 10-5 15 0 5-5 10-5 15 0" />
        </svg>
        <span class="auspicious-mark" aria-hidden="true">
          <svg viewBox="0 0 52 34">
            <path d="M7 26c-7-1-7-10 0-11 0-8 11-10 15-4 5-8 18-5 17 5 9-1 10 10 3 12H10" />
            <path d="M20 17c2-4 8-4 10 0 2 5-8 9-10 0Z" />
          </svg>
        </span>
      </header>

      <section class="method-section" aria-labelledby="method-title">
        <div class="section-heading">
          <div>
            <span>十三法门</span>
            <h2 id="method-title">选择排盘方式</h2>
          </div>
          <p>点击图标进入排盘</p>
        </div>
        <div class="method-grid" id="method-grid"></div>
      </section>

      <p class="disclaimer">传统文化研究与娱乐参考，请理性看待推演结果</p>
    </main>

    <div class="sheet-layer" id="sheet-layer" aria-hidden="true">
      <button
        class="sheet-scrim"
        type="button"
        data-action="close-sheet"
        aria-label="关闭排盘信息"
        tabindex="-1"
      ></button>
      <section
        class="entry-sheet"
        id="entry-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheet-title"
        tabindex="-1"
      >
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="sheet-header">
          <span class="sheet-icon" id="sheet-icon" aria-hidden="true"></span>
          <div>
            <small id="sheet-category">命理排盘</small>
            <h2 id="sheet-title">生平子时</h2>
          </div>
          <button class="sheet-close pressable" type="button" data-action="close-sheet" aria-label="关闭窗口">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <p class="sheet-summary" id="sheet-summary"></p>
        <div class="field-preview" id="field-preview"></div>
        <p class="privacy-note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z" /><path d="m9 12 2 2 4-5" /></svg>
          出生信息仅保存在当前设备，用于本次排盘
        </p>
        <button class="enter-button pressable" type="button" data-action="enter-chart">
          <span>进入排盘</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M14 7l5 5-5 5" /></svg>
        </button>
      </section>
    </div>

    <div class="chart-toast" id="chart-toast" role="status" aria-live="polite"></div>
    <script src="../js/chart-prototypes.js"></script>
  </body>
</html>
