<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fff9f1" />
    <meta name="format-detection" content="telephone=no" />
    <title>与国学老师对话</title>
    <script src="../js/preferences.js"></script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="chat-page">
    <header class="chat-topbar" aria-label="对话导航">
      <a class="chat-back pressable" href="./index.html" data-navigation-back aria-label="返回上一页">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <path d="M27 11 16 22l11 11M17 22h16" />
        </svg>
      </a>
      <div class="chat-heading">
        <h1>国学老师</h1>
        <span>在线解答</span>
      </div>
      <div class="chat-quota" id="chat-promotion-badge" aria-label="限时免费">
        <span data-promotion-badge-text>限时免费</span>
      </div>
    </header>

    <main class="chat-shell">
      <section class="report-chat-context" id="report-chat-context" hidden>
        <img src="../../public/images/teacher-avatar-centered.png" alt="" />
        <div>
          <span>国心解读</span>
          <strong id="report-chat-context-title"></strong>
          <a class="pressable" id="report-chat-context-link" href="./interpretation.html">
            返回查看报告
          </a>
        </div>
      </section>

      <section class="chat-conversation" aria-label="与国学老师的对话">
        <time class="chat-start-time" id="chat-start-time"></time>
        <div class="inline-message-list" id="inline-message-list" aria-live="polite"></div>
      </section>
    </main>

    <div class="voice-dock chat-dock" aria-label="对话工具栏">
      <div class="image-preview-card" id="chat-image-preview" hidden>
        <img id="chat-image-preview-image" alt="待发送图片预览" />
        <span><strong>已选择 1 张图片</strong><small id="chat-image-preview-name"></small></span>
        <button id="chat-image-remove" type="button" aria-label="移除已选择的图片">×</button>
      </div>
      <div class="profile-switcher">
        <button id="chat-profile-trigger" class="profile-switch-button pressable" type="button" aria-label="切换咨询档案" aria-controls="chat-profile-menu" aria-expanded="false">
          <span class="profile-switch-avatar" id="chat-profile-avatar" aria-hidden="true">档</span>
          <span class="profile-switch-name" id="chat-profile-name">选择档案</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5" /></svg>
        </button>
        <div class="profile-switch-menu" id="chat-profile-menu" hidden></div>
      </div>

      <div class="text-input-shell">
        <button class="image-upload-button pressable" id="chat-image-upload" type="button" aria-label="上传图片">
          <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3.5" y="5" width="21" height="18" rx="3" /><circle cx="10" cy="11" r="2" /><path d="m5.5 20 5.5-5 4 3 3.5-4 4 6" /></svg>
        </button>
        <input class="sr-only" id="chat-image-input" type="file" accept="image/jpeg,image/png,image/webp" />
        <input id="chat-question" class="text-input" type="text" aria-label="文字输入" placeholder="请输入问题" autocomplete="off" />
      </div>

      <button
        id="chat-action"
        class="dock-icon send-button home-action pressable"
        type="button"
        aria-label="发送问题"
        disabled
      >
        <svg viewBox="0 0 72 72" aria-hidden="true">
          <circle cx="36" cy="36" r="30" />
          <path d="M36 49V23M25 34l11-11 11 11" />
        </svg>
      </button>

      <p class="quota-guide" id="chat-quota-guide" hidden>今日免费对话次数已用完</p>
    </div>

    <div class="app-toast" id="chat-toast" role="status" aria-live="polite"></div>

    <script src="../js/shared.js"></script>
    <script src="../js/image-attachments.js"></script>
    <script src="../js/chat-replies.js"></script>
    <script src="../js/chat.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
