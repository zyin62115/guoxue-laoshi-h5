<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fff9f1" />
    <meta name="format-detection" content="telephone=no" />
    <title>国学老师</title>
    <script src="../js/preferences.js"></script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="home-page">
    <main class="page-shell">
      <header class="topbar" aria-label="页面导航">
        <h1 class="sr-only">国学老师</h1>

        <div class="quota" id="home-promotion-badge" aria-label="限时免费">
          <span data-promotion-badge-text>限时免费</span>
        </div>
      </header>

      <div class="design-canvas">
        <section class="hero" aria-labelledby="guide-title">
          <div class="guide-alignment">
            <img class="hero-left artwork" src="../../public/images/hero-left-hd.png" alt="" />

            <div class="guide-panel">
              <div class="guide-header">
                <div class="guide-heading">
                  <img src="../../public/images/guide-mark.png" alt="" />
                  <h2 id="guide-title">今日指引</h2>
                </div>

                <div class="date-badge">
                  <time id="guide-date"><span id="guide-date-text"></span></time>
                </div>
              </div>

              <p class="guidance">
                <span id="guide-content">顺势而为，稳中求进，保持平和，善用耐心，从容落子，自见长远。</span>
              </p>

              <div class="advice-row" aria-label="今日宜忌">
                <div class="advice advice-good">
                  <span class="advice-seal" aria-hidden="true">宜</span>
                  <span id="guide-good">静心学习</span>
                </div>
                <span class="advice-divider" aria-hidden="true"></span>
                <div class="advice advice-avoid">
                  <span class="advice-seal" aria-hidden="true">忌</span>
                  <span id="guide-avoid">急躁冲动</span>
                </div>
              </div>
            </div>
          </div>

          <img class="birds artwork" src="../../public/images/birds.png" alt="" />
          <img class="top-mountain artwork" src="../../public/images/top-mountain-hd-alpha.png" alt="" />
          <img class="right-mountains artwork" src="../../public/images/right-mountains-hd-alpha.png" alt="" />
        </section>

        <div class="home-content-flow">
          <nav class="feature-list" aria-label="国学功能">
            <button class="feature-card pressable" type="button" data-action="professional-chart">
              <img src="../../public/images/candidates/simple-luopan.png" alt="" />
              <span class="feature-title">专业排盘</span>
              <span class="feature-desc">精准排盘，洞察命局</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>

            <button class="feature-card pressable" type="button" data-action="interpretation">
              <img src="../../public/images/candidates/simple-taiji.png" alt="" />
              <span class="feature-title">国心解读</span>
              <span class="feature-desc">解你疑惑，指点迷津</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>

            <button class="feature-card pressable" type="button" data-action="learning-materials">
              <img src="../../public/images/candidates/simple-book.png" alt="" />
              <span class="feature-title">学习资料</span>
              <span class="feature-desc">精选资料，易学易懂</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </nav>

          <section class="inline-chat home-guide-chat" aria-label="向国学老师提问示例">
            <div class="inline-message-list">
              <article class="inline-message-row user">
                <div class="inline-message-body">
                  <div class="inline-message-bubble">老师，你能解答什么问题？</div>
                </div>
              </article>

              <article class="inline-message-row assistant">
                <img
                  class="inline-teacher-avatar"
                  src="../../public/images/teacher-avatar-centered.png"
                  alt=""
                />
                <div class="inline-message-body">
                  <span class="inline-speaker-name">国学老师</span>
                  <div class="inline-message-bubble home-guide-answer">
                    <p>你可以问我关于<strong>八字命盘、事业财运、感情婚姻、流年运势、环境布局、人生选择</strong>等问题，也可以随时问我课程中不懂的国学知识。</p>
                    <p class="home-guide-examples-title"><strong>比如你可以这样问我：</strong></p>
                    <ul class="home-guide-examples">
                      <li>我今年的事业运怎么样？</li>
                    </ul>
                  </div>
                </div>
              </article>
            </div>
          </section>

        </div>
      </div>
    </main>

    <div class="app-toast" id="app-toast" role="status" aria-live="polite"></div>

    <div class="voice-dock" aria-label="对话工具栏">
      <div class="image-preview-card" id="home-image-preview" hidden>
        <img id="home-image-preview-image" alt="待发送图片预览" />
        <span><strong>已选择 1 张图片</strong><small id="home-image-preview-name"></small></span>
        <button id="home-image-remove" type="button" aria-label="移除已选择的图片">×</button>
      </div>
      <div class="text-input-shell">
        <button class="image-upload-button pressable" id="home-image-upload" type="button" aria-label="上传图片">
          <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3.5" y="5" width="21" height="18" rx="3" /><circle cx="10" cy="11" r="2" /><path d="m5.5 20 5.5-5 4 3 3.5-4 4 6" /></svg>
        </button>
        <input class="sr-only" id="home-image-input" type="file" accept="image/jpeg,image/png,image/webp" />
        <input
          id="home-question"
          class="text-input"
          type="text"
          data-action="text-input"
          aria-label="文字输入"
          placeholder="请输入问题"
          autocomplete="off"
        />
      </div>

      <button
        id="home-action"
        class="dock-icon send-button home-action pressable"
        type="button"
        data-action="submit-question"
        aria-label="发送问题"
        disabled
      >
        <svg viewBox="0 0 72 72" aria-hidden="true">
          <circle cx="36" cy="36" r="30" />
          <path d="M36 49V23M25 34l11-11 11 11" />
        </svg>
      </button>

    </div>

    <button
      class="scroll-top-button pressable"
      id="scroll-top-button"
      type="button"
      data-action="scroll-top"
      aria-label="返回页面顶部"
      aria-hidden="true"
      tabindex="-1"
    >
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M18 37 32 23l14 14M32 24v25" />
      </svg>
    </button>

    <script src="../js/image-attachments.js"></script>
    <script src="../js/daily-guides.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
