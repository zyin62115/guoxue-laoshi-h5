<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fff9f1" />
    <meta name="format-detection" content="telephone=no" />
    <title>国学老师</title>
    <script src="../js/preferences.js"></script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" aria-label="页面导航">
        <button
          class="icon-button menu-button pressable"
          type="button"
          data-action="menu"
          aria-label="打开个人中心"
          aria-controls="personal-drawer"
          aria-expanded="false"
        >
          <svg viewBox="0 0 44 38" aria-hidden="true">
            <path d="M3 4h34M3 19h28M3 34h22" />
          </svg>
        </button>
        <h1 class="brand">国学老师</h1>

        <div class="quota" id="home-promotion-badge" aria-label="限时免费">
          <span data-promotion-badge-text>限时免费</span>
        </div>
      </header>

      <div class="design-canvas">
        <section class="hero" aria-labelledby="guide-title">
          <img class="hero-left artwork" src="../../public/images/hero-left-hd.png" alt="" />
          <img class="birds artwork" src="../../public/images/birds.png" alt="" />
          <img class="top-mountain artwork" src="../../public/images/top-mountain-hd-alpha.png" alt="" />
          <img class="right-mountains artwork" src="../../public/images/right-mountains-hd-alpha.png" alt="" />

          <div class="guide-heading">
            <img src="../../public/images/guide-mark.png" alt="" />
            <h2 id="guide-title">今日指引</h2>
          </div>

          <p class="guidance">
            <span id="guide-line-one">顺势而为，稳中求进，保持平和心态，</span><span id="guide-line-two">善用耐心，方能见长远之效。</span>
          </p>

          <div class="advice-row" aria-label="今日宜忌">
            <div class="advice advice-good">
              <span class="advice-seal" aria-hidden="true">宜</span>
              <span id="guide-good">静心学习</span>
            </div>
            <span class="advice-divider" aria-hidden="true"></span>
            <div class="advice advice-avoid">
              <span class="advice-seal" aria-hidden="true">忌</span>
              <span id="guide-avoid">急躁冲动</span>
            </div>
          </div>
        </section>

        <a
          class="date-badge pressable"
          href="./calendar.html"
          aria-label="打开万年历"
        >
          <time id="guide-date"><span id="guide-date-text"></span></time>
          <span class="calendar-entry-label">万年历<i aria-hidden="true"></i></span>
        </a>

        <div class="home-content-flow">
          <nav class="feature-list" aria-label="国学功能">
            <button class="feature-card pressable" type="button" data-action="professional-chart">
              <img src="../../public/images/candidates/simple-luopan.png" alt="" />
              <span class="feature-title">专业排盘</span>
              <span class="feature-desc">精准排盘，洞察命局</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>

            <button class="feature-card pressable" type="button" data-action="interpretation">
              <img src="../../public/images/candidates/simple-taiji.png" alt="" />
              <span class="feature-title">国心解读</span>
              <span class="feature-desc">解你疑惑，指点迷津</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>

            <button class="feature-card pressable" type="button" data-action="learning-materials">
              <img src="../../public/images/candidates/simple-book.png" alt="" />
              <span class="feature-title">学习资料</span>
              <span class="feature-desc">精选资料，易学易懂</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </nav>

        </div>
      </div>
    </main>

    <div class="edge-swipe-zone" aria-hidden="true"></div>

    <div class="drawer-layer" id="drawer-layer" aria-hidden="true">
      <button
        class="drawer-scrim"
        type="button"
        data-action="close-drawer"
        aria-label="关闭个人中心"
        tabindex="-1"
      ></button>

      <aside
        class="personal-drawer"
        id="personal-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="drawer-title"
        tabindex="-1"
      >
        <div class="drawer-scroll">
          <header class="drawer-profile">
            <a
              class="guest-avatar pressable"
              id="drawer-user-avatar"
              data-avatar="mountain"
              href="./settings.html"
              aria-label="打开个人资料与设置"
            >
              <b aria-hidden="true">山</b>
            </a>
            <a
              class="guest-copy pressable"
              href="./settings.html"
            >
              <strong id="drawer-title">访客</strong>
              <span>个人资料与设置 <i aria-hidden="true"></i></span>
            </a>
            <button
              class="drawer-close pressable"
              type="button"
              data-action="close-drawer"
              aria-label="关闭个人中心"
            >
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="M8 8l16 16M24 8 8 24" />
              </svg>
            </button>
          </header>

          <nav class="drawer-entry-list" aria-label="个人内容">
            <a class="drawer-entry pressable" href="./profiles.html">
              <span class="drawer-entry-mark" aria-hidden="true">档</span>
              <span>
                <strong>我的档案</strong>
                <small>管理出生信息与当前使用档案</small>
              </span>
              <i aria-hidden="true"></i>
            </a>
            <a class="drawer-entry pressable" href="./reports.html">
              <span class="drawer-entry-mark" aria-hidden="true">报</span>
              <span>
                <strong>我的报告</strong>
                <small>查看已生成和已解锁的国心解读</small>
              </span>
              <i aria-hidden="true"></i>
            </a>
          </nav>

          <section class="drawer-section history-section" aria-labelledby="history-title">
            <div class="drawer-section-heading history-heading">
              <div>
                <h2 id="history-title">对话记录</h2>
                <p>每天自动整理为一段会话</p>
              </div>
            </div>
            <div class="conversation-list" id="conversation-list"></div>
          </section>
        </div>
      </aside>
    </div>

    <div class="app-toast" id="app-toast" role="status" aria-live="polite"></div>

    <div class="voice-dock" aria-label="对话工具栏">
      <button
        class="dock-icon mic-button pressable"
        type="button"
        data-action="voice-mode"
        aria-label="切换到语音输入"
      >
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="23" y="8" width="18" height="34" rx="9" />
          <path d="M15 31c0 10 7.6 18 17 18s17-8 17-18M32 49v8M23 57h18" />
        </svg>
      </button>

      <input
        id="home-question"
        class="text-input"
        type="text"
        data-action="text-input"
        aria-label="文字输入"
        placeholder="请输入问题"
        autocomplete="off"
      />

      <button
        id="home-action"
        class="dock-icon plus-button home-action pressable"
        type="button"
        data-action="more"
        aria-label="更多功能"
      >
        <svg class="plus-icon" viewBox="0 0 72 72" aria-hidden="true">
          <circle cx="36" cy="36" r="30" />
          <path d="M36 20v32M20 36h32" />
        </svg>
        <svg class="send-icon" viewBox="0 0 72 72" aria-hidden="true">
          <circle cx="36" cy="36" r="30" />
          <path d="M23 36h25M39 26l10 10-10 10" />
        </svg>
      </button>

      <p class="quota-guide" id="home-quota-guide" hidden>
        限时免费体验已结束。
      </p>
    </div>

    <button
      class="scroll-top-button pressable"
      id="scroll-top-button"
      type="button"
      data-action="scroll-top"
      aria-label="返回页面顶部"
      aria-hidden="true"
      tabindex="-1"
    >
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M18 37 32 23l14 14M32 24v25" />
      </svg>
    </button>

    <script src="../js/shared.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
