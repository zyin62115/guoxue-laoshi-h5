<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fff9f1" />
    <meta name="format-detection" content="telephone=no" />
    <title>登录国学老师</title>
    <script src="../js/preferences.js"></script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="profile-back pressable login-back" href="./index.html" data-navigation-back aria-label="返回上一页"></a>
      <section class="login-card" aria-labelledby="login-title">
        <img src="../../public/images/teacher-avatar-centered.png" alt="" />
        <h1 id="login-title">登录国学老师</h1>
        <p>登录后可保存个人档案，获得更完整、更连贯的 AI 解读体验。</p>
        <form id="login-form" novalidate>
          <label for="login-phone"><span>手机号</span><input id="login-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" /></label>
          <label for="login-code"><span>验证码</span><span class="login-code-row"><input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入验证码" /><button id="send-login-code" class="pressable" type="button">获取验证码</button></span></label>
          <p class="form-error login-error" id="login-error" role="alert" aria-live="polite"></p>
          <button class="settings-save pressable" type="submit">登录</button>
        </form>
        <small>本页为 MVP 演示，不会发送真实短信。演示验证码为 123456。</small>
      </section>
    </main>
    <div class="app-toast" id="login-toast" role="status" aria-live="polite"></div>
    <script src="../js/shared.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/navigation.js"></script>
  </body>
</html>
