<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fff9f1" />
    <meta name="format-detection" content="telephone=no" />
    <title>八字档案</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="profile-page">
    <main class="profile-page-shell">
      <header class="profile-page-header">
        <a class="profile-back pressable" href="./index.html#menu" aria-label="返回个人中心"></a>
        <h1 id="profile-page-title">新增八字档案</h1>
        <span aria-hidden="true"></span>
      </header>

      <section class="profile-intro" aria-label="档案说明">
        <strong>出生信息</strong>
        <p>用于保存个人八字资料。本版本不会自动换算历法或生成排盘，请按所选历法准确填写。</p>
      </section>

      <form class="profile-form" id="profile-form" novalidate>
        <label class="form-field">
          <span>姓名或称呼<i class="required-mark" aria-hidden="true">*</i></span>
          <input
            id="profile-name"
            name="name"
            type="text"
            maxlength="24"
            autocomplete="name"
            placeholder="例如：我、妈妈、张先生"
            required
          />
        </label>

        <fieldset class="form-field choice-field">
          <legend>性别<i class="required-mark" aria-hidden="true">*</i></legend>
          <div class="segmented-choice">
            <label>
              <input type="radio" name="gender" value="male" checked />
              <span>男</span>
            </label>
            <label>
              <input type="radio" name="gender" value="female" />
              <span>女</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="form-field choice-field">
          <legend>历法<i class="required-mark" aria-hidden="true">*</i></legend>
          <div class="segmented-choice">
            <label>
              <input type="radio" name="calendar" value="solar" checked />
              <span>公历</span>
            </label>
            <label>
              <input type="radio" name="calendar" value="lunar" />
              <span>农历</span>
            </label>
          </div>
        </fieldset>

        <div class="form-field">
          <span>出生日期<i class="required-mark" aria-hidden="true">*</i></span>
          <div class="birth-date-grid">
            <label>
              <span class="sr-only">出生年份</span>
              <input
                id="birth-year"
                name="birthYear"
                type="number"
                inputmode="numeric"
                min="1900"
                max="2100"
                placeholder="年份"
                required
              />
            </label>
            <label>
              <span class="sr-only">出生月份</span>
              <input
                id="birth-month"
                name="birthMonth"
                type="number"
                inputmode="numeric"
                min="1"
                max="12"
                placeholder="月"
                required
              />
            </label>
            <label>
              <span class="sr-only">出生日期</span>
              <input
                id="birth-day"
                name="birthDay"
                type="number"
                inputmode="numeric"
                min="1"
                max="31"
                placeholder="日"
                required
              />
            </label>
          </div>
        </div>

        <label class="leap-month-field" id="leap-month-field" hidden>
          <input id="is-leap-month" name="isLeapMonth" type="checkbox" />
          <span>该月为闰月</span>
        </label>

        <label class="form-field">
          <span>出生时间<i class="required-mark" aria-hidden="true">*</i></span>
          <input id="birth-time" name="birthTime" type="time" required />
        </label>

        <label class="form-field">
          <span>出生地（选填）</span>
          <select id="birthplace" name="birthplace" autocomplete="address-level1">
            <option value="">请选择出生地（可选）</option>
            <option value="北京市">北京市</option>
            <option value="天津市">天津市</option>
            <option value="河北省">河北省</option>
            <option value="山西省">山西省</option>
            <option value="内蒙古自治区">内蒙古自治区</option>
            <option value="辽宁省">辽宁省</option>
            <option value="吉林省">吉林省</option>
            <option value="黑龙江省">黑龙江省</option>
            <option value="上海市">上海市</option>
            <option value="江苏省">江苏省</option>
            <option value="浙江省">浙江省</option>
            <option value="安徽省">安徽省</option>
            <option value="福建省">福建省</option>
            <option value="江西省">江西省</option>
            <option value="山东省">山东省</option>
            <option value="河南省">河南省</option>
            <option value="湖北省">湖北省</option>
            <option value="湖南省">湖南省</option>
            <option value="广东省">广东省</option>
            <option value="广西壮族自治区">广西壮族自治区</option>
            <option value="海南省">海南省</option>
            <option value="重庆市">重庆市</option>
            <option value="四川省">四川省</option>
            <option value="贵州省">贵州省</option>
            <option value="云南省">云南省</option>
            <option value="西藏自治区">西藏自治区</option>
            <option value="陕西省">陕西省</option>
            <option value="甘肃省">甘肃省</option>
            <option value="青海省">青海省</option>
            <option value="宁夏回族自治区">宁夏回族自治区</option>
            <option value="新疆维吾尔自治区">新疆维吾尔自治区</option>
            <option value="香港特别行政区">香港特别行政区</option>
            <option value="澳门特别行政区">澳门特别行政区</option>
            <option value="台湾省">台湾省</option>
            <option value="海外">海外</option>
          </select>
        </label>

        <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>

        <div class="profile-actions">
          <button class="profile-action profile-cancel pressable" type="button" id="cancel-profile">
            取消
          </button>
          <button class="profile-action profile-save pressable" type="submit">
            保存档案
          </button>
        </div>

        <button class="profile-delete pressable" type="button" id="delete-profile" hidden>
          删除这份档案
        </button>
      </form>
    </main>

    <script src="../js/shared.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
